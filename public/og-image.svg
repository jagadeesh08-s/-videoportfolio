<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="50%" stop-color="#141414" />
      <stop offset="100%" stop-color="#1a0505" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a2a" />
      <stop offset="100%" stop-color="#ff6b6b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Glows -->
  <circle cx="1050" cy="150" r="220" fill="#ff2a2a" opacity="0.25" filter="url(#glow)" />
  <circle cx="150" cy="500" r="180" fill="#863bff" opacity="0.15" filter="url(#glow)" />

  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>

  <!-- Decorative Badge -->
  <g transform="translate(100, 110)">
    <rect width="320" height="38" rx="19" fill="#ff2a2a" fill-opacity="0.15" stroke="#ff2a2a" stroke-width="1.5" />
    <circle cx="20" cy="19" r="5" fill="#ff2a2a" />
    <text x="36" y="24" fill="#ff8585" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">🏆 1ST PLACE AQVH 2025</text>
  </g>

  <!-- Main Name Heading -->
  <text x="100" y="240" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="900" letter-spacing="-1.5">
    Jagadeesh Sappa<tspan fill="#ff2a2a">.</tspan>
  </text>

  <!-- Subtitle / Tagline -->
  <text x="100" y="310" fill="url(#redGlow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">
    ECE Engineer &amp; Quantum Computing Developer
  </text>

  <!-- Description -->
  <text x="100" y="375" fill="#a0a0a0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    Creator of Bloch Verse · Qiskit &amp; OpenQASM · VLSI &amp; Embedded Systems · Full-Stack React
  </text>

  <!-- Tags / Pills -->
  <g transform="translate(100, 440)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="160" height="42" rx="12" fill="#222222" stroke="#333333" />
    <text x="80" y="26" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Quantum Tech</text>

    <!-- Tag 2 -->
    <rect x="175" y="0" width="170" height="42" rx="12" fill="#222222" stroke="#333333" />
    <text x="260" y="26" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Qiskit / OpenQASM</text>

    <!-- Tag 3 -->
    <rect x="360" y="0" width="150" height="42" rx="12" fill="#222222" stroke="#333333" />
    <text x="435" y="26" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">VLSI &amp; FPGA</text>

    <!-- Tag 4 -->
    <rect x="525" y="0" width="160" height="42" rx="12" fill="#222222" stroke="#333333" />
    <text x="605" y="26" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">React &amp; Node.js</text>
  </g>

  <!-- Footer Link -->
  <text x="100" y="550" fill="#777777" font-family="monospace" font-size="16">
    🌐 https://jagadeesh-sappa.vercel.app  •  github.com/jagadeesh08-s
  </text>
</svg>
